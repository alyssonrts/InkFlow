
spring:
  application:
    name: inkflow
  config:
    # Lê o mesmo .env usado pelo docker-compose
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # O esquema é criado e evoluído pelo Flyway
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Recife
  flyway:
    enabled: true
    locations: classpath:db/migration

  # Configuração de upload de imagens
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080

inkflow:
  jwt:
    # Chave de assinatura dos tokens definida no .env
    secret: ${JWT_SECRET}
    expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:120}
  cors:
    origens: ${CORS_ORIGENS:http://localhost:5173}
  demonstracao:
    # Cria salas e contas de demonstração
    habilitada: ${INKFLOW_DEMONSTRACAO:true}

  # Diretório de armazenamento das imagens
  upload:
    diretorio: ${INKFLOW_UPLOAD_DIR:./uploads}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
