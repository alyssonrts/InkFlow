spring:
  application:
    name: inkflow
  config:
    # Lê o mesmo .env usado pelo docker-compose (arquivo na raiz do projeto)
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # O esquema é criado e evoluído pelo Flyway; o Hibernate apenas confere
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Recife
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
