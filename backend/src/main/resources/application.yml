spring:
  application:
    name: inkflow
  config:
    # Lê o mesmo .env usado pelo docker-compose (arquivo na raiz do projeto)
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # O esquema é criado e evoluído pelo Flyway; o Hibernate apenas confere
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Recife
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

inkflow:
  jwt:
    # Chave de assinatura dos tokens (mínimo de 32 caracteres), definida no .env
    secret: ${JWT_SECRET}
    expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:120}
  cors:
    origens: ${CORS_ORIGENS:http://localhost:5173}
  demonstracao:
    # Cria salas e contas de demonstração na primeira execução (desligar em uso real)
    habilitada: ${INKFLOW_DEMONSTRACAO:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
